<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>천외검결 — 두 세계의 검</title>
  <!-- 도트 한글 폰트 갈무리(OFL). 온라인일 때 내장 글꼴에 없는 글자를 채운다 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Song+Myung&display=swap">
  <!-- 24단계: 게임에 쓰는 글자만 담은 내장 글꼴(tools/embed-fonts.py). CDN 뒤에 두어 오프라인에서도 같은 글꼴로 보인다 -->
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sd-fonts.css">
  <link rel="stylesheet" href="css/sd-theme.css">
  <!-- 40단계: ChatGPT UI 키트(docs/ui-kit). game-skin 은 body.twj-game-skin 일 때만, ui-kit 은 twj- 부품만 꾸민다 -->
  <link rel="stylesheet" href="docs/ui-kit/ui-kit.css">
  <link rel="stylesheet" href="docs/ui-kit/game-skin.css">
  <link rel="stylesheet" href="css/sd-screens.css">
  <link rel="stylesheet" href="css/ui-kit-adapter.css">
</head>
<body>
  <div id="app">
    <div class="screen" id="screen-title"></div>
    <div class="screen" id="screen-lobby"></div>
    <div class="screen meta" id="screen-map"></div>
    <div class="screen meta" id="screen-party"></div>
    <div class="screen meta" id="screen-reward"></div>
    <div class="screen meta" id="screen-camp"></div>
    <div class="screen meta" id="screen-clear"></div>
    <div class="screen" id="screen-ending"></div>
    <div class="screen" id="screen-story"></div>
    <div class="screen" id="screen-test"></div>

    <div class="screen" id="screen-battle">
      <div class="topbar">
        <div class="stage-chip"><i class="chip"></i><span class="title">전투</span></div>
        <div class="turn-badge"><small>턴</small><b class="turn">1</b></div>
        <span class="spacer"></span>
        <div class="relic-bar"></div>
        <div class="item-bar" data-tip="<b>소모품</b><br>내 턴에 눌러 에너지 없이 쓴다. 칸 3개."></div>
        <span class="gold"><i class="ico ico-gold"></i><span class="goldv">0</span></span>
        <button class="btn small ghost undo-btn" data-tip="<b>턴 되돌리기</b> (Z)<br>이번 턴에 쓴 카드·소모품을 모두 되돌린다. 노말 모드만.">되돌리기</button>
        <button class="btn small ghost log-btn" data-tip="<b>전투 기록</b> (L)<br>지금까지 일어난 일을 본다.">기록</button>
        <button class="btn small debug-kill">적 즉사</button>
        <button class="btn small ghost to-menu">메뉴로</button>
      </div>
      <div class="field">
        <div class="hitcount"><b>0</b><small>HIT</small></div>
        <div class="combo"><b>0</b><small>연계</small><span class="bonus"></span></div>
        <div class="floor"></div>
        <div class="side heroes"></div>
        <div class="side monsters"></div>
        <div class="fore"></div>
        <div class="motes"></div>
      </div>
      <div class="handbar">
        <div class="energy" data-tip="<b>에너지</b><br>카드를 쓰는 데 든다. 매 턴 다시 채워진다."><div class="crystal"><span class="ev">3</span><small class="emax">/3</small></div><small class="next"></small></div>
        <div class="piles">
          <div class="pilebtn pix pile-draw" data-tip="뽑을 카드 (클릭해서 보기)"><i class="ico ico-draw"></i><span class="cnt-draw">0</span></div>
        </div>
        <div class="hand"></div>
        <div class="piles right">
          <div class="pilebtn pix pile-exhaust" data-tip="소멸한 카드"><i class="ico ico-exhaust"></i><span class="cnt-exhaust">0</span></div>
          <div class="pilebtn pix pile-discard" data-tip="버린 카드 (클릭해서 보기)"><i class="ico ico-discard"></i><span class="cnt-discard">0</span></div>
        </div>
        <button class="btn gold endturn">턴 종료 <kbd>E</kbd></button>
      </div>
      <div class="battle-log" hidden><div class="bl-head"><b>전투 기록</b><button class="btn small ghost bl-close">닫기</button></div><ol></ol></div>
      <div class="skip-hint" hidden>클릭하면 빨리 감기</div>
    </div>

    <div id="fx"></div>
    <div id="wipe"><i></i><i></i></div>
    <div id="aim"></div>
  </div>
  <div id="tip" class="pix"></div>

  <!-- 순서대로 로드한다 (ES 모듈·fetch 미사용, file:// 에서 동작) -->
  <script src="js/core.js"></script>

  <script src="data/story.js"></script>
  <script src="data/fx.js"></script>
  <script src="data/music.js"></script>
  <script src="data/sfx.js"></script>
  <script src="data/achievements.js"></script>
  <script src="data/asset-spec.js"></script>
  <script src="data/assets.js"></script>
  <script src="data/character-art.js"></script>
  <script src="js/character-art.js"></script>
  <script src="js/pixel.js"></script>

  <script src="js/pixel-render.js"></script>
  <script src="js/sprites-heroes.js"></script>

  <script src="js/sprites-more.js"></script>
  <script src="js/puppet.js"></script>
  <script src="js/puppet-heroes.js"></script>
  <script src="js/pixel-sculpt.js"></script>
  <script src="js/sprites-rift.js"></script>
  <script src="js/sprites-variety.js"></script>
  <script src="js/art.js"></script>
  <script src="js/art-cards.js"></script>
  <script src="js/art-map.js"></script>
  <script src="js/status.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/upgrade.js"></script>
  <script src="js/battle.js"></script>

  <script src="js/effects.js"></script>

  <script src="js/audio.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/ui-battle.js"></script>
  <script src="js/ui-dungeon.js"></script>
  <script src="js/ui-meta.js"></script>
  <script src="js/ui-lobby.js"></script>
  <script src="js/ui-story.js"></script>
  <script src="js/ui-extra.js"></script>
  <script src="js/music.js"></script>

</body>
