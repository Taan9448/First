<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>천외검결 — 카드 · 이펙트 개별 리소스</title><link rel="stylesheet" href="preview.css"><body><header><strong>카드 · 스킬 이펙트</strong><input id="search" placeholder="기술명 / 카드 ID 검색"><select id="select"></select><button id="previous">이전</button><button id="next">다음</button></header><div id="status" class="info"></div><main class="viewer"><iframe id="card" title="개별 카드 디자인"></iframe><section class="effect-panel"><h2 id="name"></h2><div class="checker" id="stage"><img id="effect" alt="개별 투명 스킬 이펙트"></div><div class="links"><button id="play">동작 미리보기</button><a id="artLink" target="_blank">원화 PNG</a><a id="fxLink" target="_blank">이펙트 PNG</a><a id="previewLink" target="_blank">개별 카드</a></div><p id="motion" class="note"></p><p class="note">이펙트 PNG는 단일 정지 레이어입니다. 이 화면의 이동·확대·사라짐은 CSS 적용 예시이며, 실제 전투의 대상과 타격 시점은 카드 규칙에 연결해야 합니다.</p></section></main><script src="manifest.js"></script><script>
(function(){var cards=window.Game.CardDelivery,select=document.getElementById('select'),current=0;function list(q){select.innerHTML='';cards.forEach(function(c,i){if(q&&!(c.id+' '+c.name).toLowerCase().includes(q.toLowerCase()))return;var o=document.createElement('option');o.value=i;o.textContent=c.id+' · '+c.name+' · '+c.rank+'단계'+(c.art.generated&&c.effect.generated?'':' (제작 중)');select.appendChild(o)});if(select.options.length){current=+select.value;show()}}
function show(){var c=cards[current];select.value=current;document.getElementById('card').src=c.preview;document.getElementById('name').textContent=c.id+' · '+c.name;var fx=document.getElementById('effect');fx.style.visibility=c.effect.generated?'visible':'hidden';if(c.effect.generated)fx.src=c.effect.path;else fx.removeAttribute('src');document.getElementById('motion').textContent=c.effect.motion;document.getElementById('status').textContent='원화 '+cards.filter(function(c){return c.art.generated}).length+'/296 · 이펙트 '+cards.filter(function(c){return c.effect.generated}).length+'/296 — 현재 '+c.rank+'단계 / 우측 상단: 카드 유형';var artLink=document.getElementById('artLink'),fxLink=document.getElementById('fxLink');if(c.art.generated){artLink.href=c.art.path;artLink.removeAttribute('aria-disabled')}else{artLink.removeAttribute('href');artLink.setAttribute('aria-disabled','true')}if(c.effect.generated){fxLink.href=c.effect.path;fxLink.removeAttribute('aria-disabled')}else{fxLink.removeAttribute('href');fxLink.setAttribute('aria-disabled','true')}document.getElementById('previewLink').href=c.preview;var stage=document.getElementById('stage');stage.className='checker'+(c.effect.direction==='centered'?' center':'');stage.style.setProperty('--duration',c.effect.durationMs+'ms')}
select.onchange=function(){current=+select.value;show()};document.getElementById('search').oninput=function(){list(this.value)};document.getElementById('previous').onclick=function(){current=Math.max(0,current-1);show()};document.getElementById('next').onclick=function(){current=Math.min(cards.length-1,current+1);show()};document.getElementById('play').onclick=function(){var stage=document.getElementById('stage');stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play')};list('');})();
</script></body></html>
