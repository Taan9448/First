<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>천외검결 — 카드 원화 미리보기</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;background:#111721;color:#eee9de;font-family:system-ui,sans-serif}header{max-width:1100px;margin:auto;padding:22px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:20px;margin:0}input,select,button{font:inherit;color:inherit;background:#202b3a;border:1px solid #465469;border-radius:7px;padding:9px 12px}button{cursor:pointer}select{max-width:330px}.count{color:#aab7c8;font-size:14px;width:100%;margin:0}main{max-width:1100px;margin:auto;display:grid;grid-template-columns:minmax(300px,570px) 1fr;gap:30px;padding:8px 24px 30px}.art-stage{display:grid;place-items:center;min-height:720px}.art-stage img{max-width:100%;max-height:720px;object-fit:contain}aside{align-self:center;line-height:1.7}h2{font-size:25px}a{color:#93ddd2}.links{display:flex;gap:16px;flex-wrap:wrap}.muted{color:#aab7c8;font-size:14px}.blank{display:none;color:#adb5c6}@media(max-width:800px){main{grid-template-columns:1fr}.art-stage{min-height:0}aside{margin-top:0}header{padding:16px}} </style><body><header><h1>카드 원화 · 개별 미리보기</h1><input id="search" placeholder="기술명 / 카드 ID 검색"><select id="cards" aria-label="완성된 카드"></select><button id="prev">이전</button><button id="next">다음</button><p id="count" class="count"></p></header><main><section class="art-stage"><img id="picture" alt=""><p class="blank" id="blank">검색 결과가 없습니다.</p></section><aside><h2 id="title"></h2><p id="details"></p><button id="toggle">원화만 보기</button><p class="links"><a id="png" target="_blank">카드 PNG</a><a id="raw" target="_blank">원화 PNG</a></p><p id="scene" class="muted"></p><p class="muted">등급은 하단에만 표시합니다.<br>우측 상단은 기존 카드 유형을 유지합니다.</p></aside></main><script src="cards.js"></script><script>
(function(){var all=Game.CardPreviewCards,ready=all.filter(function(c){return c.generated}),filtered=ready,current=0,raw=false,select=document.getElementById('cards'),picture=document.getElementById('picture');document.getElementById('count').textContent='완성 원화 '+ready.length+' / '+all.length+'장 · 개별 카드 PNG '+ready.length+'장 · 남은 원화 '+(all.length-ready.length)+'장';
function render(){select.innerHTML='';filtered.forEach(function(c,i){var o=document.createElement('option');o.value=i;o.textContent=c.id+' · '+c.name+' · '+c.rank+'단계';select.appendChild(o)});current=0;show()}
function show(){var c=filtered[current];picture.style.display=c?'':'none';document.getElementById('blank').style.display=c?'none':'block';if(!c)return;select.value=current;picture.src=raw?c.art:c.previewPng;picture.alt=c.name+(raw?' 원화':' 개별 카드');document.getElementById('title').textContent=c.name;document.getElementById('details').textContent=c.id+' · '+c.typeLabel+' · 코스트 '+(c.cost==null?'없음':c.cost)+' · '+c.rank+'단계';document.getElementById('scene').textContent=c.scene;document.getElementById('png').href=c.previewPng;document.getElementById('raw').href=c.art;document.getElementById('toggle').textContent=raw?'완성 카드 보기':'원화만 보기'}
select.onchange=function(){current=+this.value;show()};document.getElementById('prev').onclick=function(){current=(current-1+filtered.length)%filtered.length;show()};document.getElementById('next').onclick=function(){current=(current+1)%filtered.length;show()};document.getElementById('toggle').onclick=function(){raw=!raw;show()};document.getElementById('search').oninput=function(){var q=this.value.toLowerCase();filtered=ready.filter(function(c){return(c.id+' '+c.name).toLowerCase().includes(q)});render()};render()})();
</script></body></html>
